<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penguji WebSocket IoT</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:40px auto;padding:0 18px;background:#f4f6f8;color:#202632}
.card{background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 12px #0001}
button{padding:10px 16px;margin:8px 8px 8px 0;border:0;border-radius:7px;background:#1769aa;color:#fff;cursor:pointer}
#status{font-weight:bold;margin:14px 0}#messages{background:#111;color:#9ef59e;padding:14px;border-radius:8px;min-height:180px;white-space:pre-wrap;overflow-wrap:anywhere}
</style></head>
<body><div class="card">
<h2>Penguji WebSocket IoT</h2>
<p>Alamat: <code>ws://localhost:1880/ws/sensor</code></p>
<button id="connect">Hubungkan</button><button id="disconnect">Putuskan</button>
<div id="status">Status: Belum terhubung</div><h3>Pesan yang diterima</h3>
<div id="messages">Menunggu data sensor...</div></div>
<script>
let socket;
const statusEl=document.getElementById('status'), messagesEl=document.getElementById('messages');
function log(message){if(messagesEl.textContent==='Menunggu data sensor...')messagesEl.textContent='';messagesEl.textContent+=message+'\n';}
document.getElementById('connect').addEventListener('click',()=>{
 if(socket&&(socket.readyState===WebSocket.OPEN||socket.readyState===WebSocket.CONNECTING)){log('Koneksi sudah terbuka atau sedang dibuat.');return;}
 statusEl.textContent='Status: Sedang menghubungkan...';
 socket=new WebSocket('ws://localhost:1880/ws/sensor');
 socket.onopen=()=>{statusEl.textContent='Status: TERHUBUNG';log('Berhasil terhubung ke WebSocket.');};
 socket.onmessage=e=>log('Data sensor: '+e.data);
 socket.onerror=()=>{statusEl.textContent='Status: ERROR';log('Terjadi error pada koneksi WebSocket.');};
 socket.onclose=()=>{statusEl.textContent='Status: TERPUTUS';log('Koneksi WebSocket ditutup.');};
});
document.getElementById('disconnect').addEventListener('click',()=>{if(socket)socket.close();});
</script></body></html>
